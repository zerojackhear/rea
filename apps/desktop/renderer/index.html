<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';script-src 'self';style-src 'self';img-src 'self' data:;font-src 'self';connect-src 'none';base-uri 'none';form-action 'none'"
    />
    <title>REA Desktop · 本地分析工作台</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">R<span></span></span>
          <div>
            <strong>REA<span class="brand-desktop">DESKTOP</span></strong
            ><small>看见软件背后的逻辑</small>
          </div>
        </div>
        <div class="workspace-switch">
          <span class="workspace-symbol" aria-hidden="true">L</span>
          <div><strong>本地工作空间</strong><small>LOCAL WORKSPACE</small></div>
          <span class="workspace-chevron" aria-hidden="true">⌄</span>
        </div>
        <nav class="primary-nav" id="primary-nav"></nav>
        <div class="sidebar-section-label">分析模块 <span>14</span></div>
        <nav class="module-nav" id="module-nav" aria-label="分析模块"></nav>
        <div class="sidebar-bottom">
          <button class="environment-link" id="environment-link" type="button">
            <span class="connection-dot" id="sidebar-dot"></span
            ><span
              ><strong id="sidebar-status">正在连接分析引擎</strong
              ><small id="sidebar-version">所有分析在本机进行</small></span
            ><span aria-hidden="true">↗</span>
          </button>
        </div>
      </aside>
      <div class="main-shell">
        <div class="titlebar">
          <div class="titlebar-caption">REA Desktop</div>
          <div class="window-controls">
            <button type="button" id="window-minimize" aria-label="最小化">
              —</button
            ><button
              type="button"
              id="window-maximize"
              aria-label="最大化或还原"
            >
              □</button
            ><button type="button" id="window-close" aria-label="关闭">
              ×
            </button>
          </div>
        </div>
        <header class="topbar">
          <div class="breadcrumb">
            <span>工作空间</span><span class="breadcrumb-divider">/</span
            ><strong id="breadcrumb-current">分析工作台</strong>
          </div>
          <div class="topbar-right">
            <label class="global-search"
              ><span class="search-icon" aria-hidden="true"></span
              ><input
                id="global-search"
                type="search"
                placeholder="搜索工具、模块或能力…"
                aria-label="搜索全部分析工具"
                autocomplete="off"
              /><kbd>Ctrl K</kbd></label
            ><span class="local-label"
              ><span class="tiny-dot"></span>LOCAL ONLY</span
            >
          </div>
        </header>
        <main id="content" tabindex="-1" aria-live="polite"></main>
        <footer class="statusbar">
          <span
            ><span class="tiny-dot" id="statusbar-dot"></span
            ><span id="statusbar-text">正在连接本地引擎</span></span
          ><span id="statusbar-tasks">等待开始第一项分析</span
          ><span>REA · Reverse Engineer Anything</span>
        </footer>
      </div>
    </div>
    <div
      id="toast-region"
      class="toast-region"
      role="status"
      aria-live="polite"
    ></div>
  </body>
</html>
